name: Validate Mechanics Learning Lab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f tests/smoke.mjs
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Check HTML references
        run: |
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'Mechanics' index.html
      - name: Check AQA course coverage
        run: |
          grep -q '3.4.1.1' app.js
          grep -q '3.4.1.8' app.js
          grep -q '3.4.2.2' app.js
          grep -q 'Required Practical 3' app.js
          grep -q 'Required Practical 4' app.js
      - name: Check expanded learning features
        run: |
          grep -q "const lessonExtensions" app.js
          grep -q "const lessonDeepening" app.js
          grep -q "const lessonTextbook" app.js
          grep -q "mechanicsLessonAnswers" app.js
          grep -q "id:'terminal'" app.js
          grep -q "id:'impulse'" app.js
          grep -q "id:'workgraph'" app.js
          grep -q "id:'stressstrain'" app.js
          grep -q "id:'density'" app.js
          grep -q "id:'equilibrium'" app.js
          grep -q "id:'collisiontypes'" app.js
          grep -q "id:'springenergy'" app.js
          grep -q "id:'motor'" app.js
          grep -q "id:'vehicle'" app.js
          grep -q "id:'bounce'" app.js
          grep -q "id:'couplecom'" app.js
          grep -q "mechanicsMastery" app.js
          grep -q "lessonPractice" app.js
          grep -q "drawPracticalGraph" app.js
          grep -q "const simTeaching" app.js
          grep -q "const simActivities" app.js
          grep -q 'id="gGraph"' index.html
          grep -q 'id="yGraph"' index.html
          grep -q "Formula Coach Pro" index.html
          grep -q "formulaTopics" app.js
          grep -q "<strong>20</strong><span>interactive models</span>" index.html
          grep -q "<strong>42</strong><span>formula tools</span>" index.html

      - name: Check maths graph and readiness upgrades
        run: |
          grep -q 'id="view-skills"' index.html
          grep -q 'id="skillCanvas"' index.html
          grep -q 'id="structuredProblem"' index.html
          grep -q "mechanicsSkillState" app.js
          grep -q "structuredProblems" app.js
          grep -q "lessonReadinessState" app.js
          grep -q "readinessHtml" app.js
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('app.js','utf8');
          const required = [
            "querySelectorAll('[data-practice-check]')",
            "$('[data-practical]').forEach",
            "$('.mini-option'"
          ];
          const missing = required.filter(x => !src.includes(x));
          if (missing.length) {
            console.error('Missing expected multi-element selectors:', missing);
            process.exit(1);
          }
          NODE

      - name: Check virtual experiment studio
        run: |
          grep -q "const simPedagogy" app.js
          grep -q "simPredictions" app.js
          grep -q "simMeasureTool" app.js
          grep -q "drawLinkedView" app.js
          grep -q "checkFbd" app.js
          grep -q "analyseInvestigation" app.js
          grep -q "simScenarioProgress" app.js
          grep -q "simSandbox" app.js
          grep -q 'id="simTimeline"' index.html
          grep -q 'id="linkedSimCanvas"' index.html
          grep -q 'id="fbdCanvas"' index.html
          grep -q 'id="investigationCanvas"' index.html
          grep -q 'id="sandboxToggle"' index.html
      - name: Check projectile launch-height upgrade
        run: |
          grep -q "Launch height above ground" app.js
          grep -q "projectileStats" app.js
          grep -q "projectileLayout" app.js
          grep -q "lessonExtraTextbook" app.js
          grep -q "Launching from a height" app.js
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 > /tmp/mechanics-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke
